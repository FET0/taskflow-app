name: Build and publish TaskFlow API

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - migrations/**
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - migrations/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: taskflow-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: >-
            ${{
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' ||
               github.event_name == 'workflow_dispatch')
            }}
          tags: |
            ghcr.io/fet0/taskflow-api:main
            ghcr.io/fet0/taskflow-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/FET0/taskflow-app
